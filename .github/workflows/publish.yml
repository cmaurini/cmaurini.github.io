name: Publish site

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_lmm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: check
        env:
          HAS_KEY: ${{ secrets.LMM_SSH_PRIVATE_KEY != '' }}
          HAS_HOST: ${{ secrets.LMM_HOST != '' }}
          HAS_USER: ${{ secrets.LMM_USER != '' }}
          HAS_PATH: ${{ secrets.LMM_SITE_PATH != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_HOST" = "true" ] && [ "$HAS_USER" = "true" ] && [ "$HAS_PATH" = "true" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "LMM deployment secrets not configured, skipping."
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Ruby
        if: steps.check.outputs.configured == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        if: steps.check.outputs.configured == 'true'
        run: bundle exec jekyll build --config _config.yml

      - name: Start SSH agent
        if: steps.check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LMM_SSH_PRIVATE_KEY }}

      - name: Add LMM host key
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.LMM_SSH_PORT || '22' }}" -H "${{ secrets.LMM_HOST }}" >> ~/.ssh/known_hosts

      - name: Add jump host key (optional)
        if: steps.check.outputs.configured == 'true' && secrets.LMM_SSH_JUMP_HOST != ''
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.LMM_SSH_JUMP_PORT || '22' }}" -H "${{ secrets.LMM_SSH_JUMP_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to LMM via rsync
        if: steps.check.outputs.configured == 'true'
        env:
          LMM_SSH_PORT: ${{ secrets.LMM_SSH_PORT || '22' }}
          LMM_SSH_JUMP_HOST: ${{ secrets.LMM_SSH_JUMP_HOST }}
          LMM_SSH_JUMP_PORT: ${{ secrets.LMM_SSH_JUMP_PORT || '22' }}
          LMM_SSH_JUMP_USER: ${{ secrets.LMM_SSH_JUMP_USER }}
        run: |
          SSH_CMD="ssh -p ${LMM_SSH_PORT}"
          if [ -n "${LMM_SSH_JUMP_HOST}" ]; then
            JUMP_TARGET="${LMM_SSH_JUMP_HOST}"
            if [ -n "${LMM_SSH_JUMP_USER}" ]; then
              JUMP_TARGET="${LMM_SSH_JUMP_USER}@${LMM_SSH_JUMP_HOST}"
            fi
            if [ "${LMM_SSH_JUMP_PORT}" != "22" ]; then
              JUMP_TARGET="${JUMP_TARGET}:${LMM_SSH_JUMP_PORT}"
            fi
            SSH_CMD="${SSH_CMD} -o ProxyJump=${JUMP_TARGET}"
          fi

          rsync -avz --delete \
            -e "${SSH_CMD}" \
            _site/ \
            "${{ secrets.LMM_USER }}@${{ secrets.LMM_HOST }}:${{ secrets.LMM_SITE_PATH }}"
